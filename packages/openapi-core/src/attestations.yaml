openapi: 3.1.0
info:
  title: Attestations API
  version: 0.1.0
  description: |
    IoT integrity attestations bound to rides; holds block settlement payout (BR-3, BR-12).
  license:
    name: Proprietary
    url: https://peerwheel.local/license
  x-domain: att
servers:
  - url: https://api.peerwheel.local
security:
  - apiKey: []
tags:
  - name: Attestations
    description: IoT integrity proofs
paths:
  /v1/attestations:
    get:
      operationId: listAttestations
      tags: [Attestations]
      summary: List attestations / holds
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema:
            $ref: ./attestations.schemas.yaml#/components/schemas/AttestationResult
        - name: rideId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Attestations page
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/AttestationListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/rides/{rideId}/attestations:
    post:
      operationId: submitIntegrityAttestation
      tags: [Attestations]
      summary: Submit an integrity attestation for a ride phase
      parameters:
        - name: rideId
          in: path
          required: true
          schema: { type: string }
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./attestations.schemas.yaml#/components/schemas/IntegrityAttestationCreate
      responses:
        '201':
          description: Attestation recorded
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/IntegrityAttestationResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/attestations/{attestationId}:
    get:
      operationId: getAttestation
      tags: [Attestations]
      summary: Get attestation (proof hash only — no raw streams)
      parameters:
        - name: attestationId
          in: path
          required: true
          schema:
            $ref: ./attestations.schemas.yaml#/components/schemas/AttestationId
      responses:
        '200':
          description: Attestation
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/IntegrityAttestationResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/attestations/{attestationId}/clear-hold:
    post:
      operationId: clearAttestationHold
      tags: [Attestations]
      summary: Clear an integrity hold to unlock payout
      parameters:
        - name: attestationId
          in: path
          required: true
          schema:
            $ref: ./attestations.schemas.yaml#/components/schemas/AttestationId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Hold cleared
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/IntegrityAttestationResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/attestations/{attestationId}/keep-hold:
    post:
      operationId: keepAttestationHold
      tags: [Attestations]
      summary: Keep integrity hold (blocks settlement)
      parameters:
        - name: attestationId
          in: path
          required: true
          schema:
            $ref: ./attestations.schemas.yaml#/components/schemas/AttestationId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Hold retained
          content:
            application/json:
              schema:
                $ref: ./attestations.schemas.yaml#/components/schemas/IntegrityAttestationResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
